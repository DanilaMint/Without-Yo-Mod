# Глобальные настройки Gradle — JVM, кодировка, поведение конфигурации
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# Чтобы консоль не пестрела предупреждениями от старых плагинов в новых версиях gradle
org.gradle.warning.mode=summary

# Версии Java
java.target.version=17

# Версии моддинга (для справки; переопределяются в подпроектах через собственные gradle.properties)
mod_version=1.0.0