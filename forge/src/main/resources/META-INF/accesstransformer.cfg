# Access Transformer — без него Mixin'ы, требующие доступа к приватным полям,
# не смогут работать на Forge. Полностью пустой файл допустим: он говорит Forge,
# что этот мод НЕ запрашивает никаких AT. Mixin-loader Forge использует Mixin'ы
# через рефмап; AT нужен только для access к приватным полям/методам.
#
# В нашем случае Mixin'ы работают с публичным API (Component.getString(),
# EditBox.getValue(), CreativeModeTab.buildContents), поэтому AT не нужен.
# Файл оставлен для совместимости с конфигурацией ForgeGradle.