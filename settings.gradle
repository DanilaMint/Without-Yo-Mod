// settings.gradle
//
// Структура: корневой Gradle-проект с тремя независимыми subprojects — fabric, forge,
// neoforge. Общий код (RussianTextNormalizer, JEI Mixin'ы, константы) хранится в
// директории common/, но НЕ как Gradle subproject — каждый loader-проект
// подключает её через sourceSets.main.java.srcDirs += '../common/src/main/java'.
//
// Это позволяет одному и тому же Java-коду компилироваться в контексте разных
// маппингов (Yarn для Fabric, Mojang/SRG для Forge и NeoForge) без конфликтов.

pluginManagement {
    // Где искать plugin-ы — fabric-loom живёт на maven.fabricmc.net,
    // ForgeGradle на maven.minecraftforge.net, NeoGradle на maven.neoforged.net.
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

rootProject.name = 'withoutyo'

include 'fabric'
include 'forge'
include 'neoforge'
